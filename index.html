<!DOCTYPE html>
<html>
<head>
    <title>Fraud Detection System</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #667eea, #764ba2);
            margin: 0;
            padding: 0;
        }

        .header {
            background-color: #222;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .container {
            width: 350px;
            margin: 60px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 10px;
        }

        .info {
            color: #555;
            font-size: 14px;
        }

        input, select {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        input:focus, select:focus {
            border-color: #667eea;
            outline: none;
        }

        button {
            width: 95%;
            padding: 10px;
            margin-top: 10px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #4c5bd4;
        }

        .clear-btn {
            background-color: gray;
        }

        .result-box {
            margin-top: 20px;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
        }

        .fraud {
            background-color: #ffe5e5;
            color: red;
        }

        .safe {
            background-color: #e6ffe6;
            color: green;
        }

        .loading {
            color: #444;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="header">
    <h2>Fraud Detection Dashboard</h2>
</div>

<div class="container">

    <h3>Check Transaction</h3>
    <p class="info">Enter details to check if transaction is safe</p>

    <form method="POST">

        <input type="number" name="amount" placeholder="Enter Amount" required>

        <select name="time">
            <option>Day</option>
            <option>Night</option>
        </select>

        <input type="text" name="location" placeholder="Enter Location" required>

        <button type="submit" onclick="this.innerText='Checking...'">Check Fraud</button>

        <button type="reset" class="clear-btn">Clear</button>

    </form>

    {% if result %}

        <div class="result-box {% if result['Fraud Status'] == 'Fraud' %}fraud{% else %}safe{% endif %}">

            {% if result['Fraud Status'] == 'Fraud' %}
                🚨 Fraud Detected
            {% else %}
                ✅ Transaction Safe
            {% endif %}

            <br><br>

            Risk Level: {{ result['Risk Level'] }}

        </div>

    {% endif %}

</div>

</body>
</html>
