<!DOCTYPE html>
<html>
<head>
    <title>Fraud Detection</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }
        input, select {
            padding: 8px;
            margin: 5px;
        }
        button {
            padding: 10px;
            background-color: blue;
            color: white;
        }
    </style>
</head>
<body>

    <h2>Fraud Detection System</h2>

    <form method="POST">

        <label>Amount:</label><br>
        <input type="number" name="amount" required><br><br>

        <label>Time:</label><br>
        <select name="time">
            <option>Day</option>
            <option>Night</option>
        </select><br><br>

        <label>Location:</label><br>
        <input type="text" name="location"><br><br>

        <button type="submit">Check Fraud</button>
        <form action="/train" method="post">
            <button type="submit">Train ML Model</button>
        </form>
        ``

    </form>

    {% if result %}
        <h3>Result:</h3>
        <p>Fraud Status: {{ result['Fraud Status'] }}</p>
        <p>Risk Level: {{ result['Risk Level'] }}</p>
    {% endif %}

</body>
</html>
